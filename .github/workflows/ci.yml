name: Offline source and package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      TYPESAFE_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: /usr/bin/env -u BUN_OPTIONS -u NODE_OPTIONS bun --no-env-file --config="$GITHUB_WORKSPACE/config/runtime.bunfig.toml" install --frozen-lockfile --ignore-scripts
      - run: /usr/bin/env -u BUN_OPTIONS -u NODE_OPTIONS bun --no-env-file --no-install --config="$GITHUB_WORKSPACE/config/runtime.bunfig.toml" run check
      - run: python3 scripts/distribution/test_package.py
      - run: python3 scripts/distribution/test_skill_docs.py
      - run: python3 scripts/distribution/skill-docs.py check
      - name: Verify independently installed Skill folder
        run: |
          python3 -c 'import os,pathlib,shutil; shutil.copytree("skills/task-checkpoint-record", pathlib.Path(os.environ["RUNNER_TEMP"])/"skill-only", symlinks=True)'
          python3 scripts/distribution/skill-docs.py links --skill-root "$RUNNER_TEMP/skill-only"
      - run: python3 scripts/distribution/test_bundle.py
      - run: python3 scripts/distribution/test_client_plugins.py
      - run: python3 container/test-protocol.py
      - run: python3 scripts/distribution/package.py check
      - name: Build allowlisted public artifacts
        run: python3 scripts/distribution/package.py archive --output "$RUNNER_TEMP/public-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-source-and-plugin
          path: ${{ runner.temp }}/public-artifacts/*
          if-no-files-found: error
          retention-days: 7
