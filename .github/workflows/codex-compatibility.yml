name: Qualify the latest stable Codex full package without accounts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  BUN_OPTIONS: ''
  NODE_OPTIONS: ''
  PYTHONPATH: ''
  PYTHONHOME: ''
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve official metadata and qualify an isolated full package
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          python3 -I -B container/resolve-latest.py --output "$RUNNER_TEMP/codex-lock.json"
          python3 -I -B scripts/runtime/update.py qualify --root "$RUNNER_TEMP/codex-package" \
            --lock "$RUNNER_TEMP/codex-lock.json" > "$RUNNER_TEMP/qualification-result.json"
          python3 -I -B - "$RUNNER_TEMP/qualification-result.json" "$RUNNER_TEMP/qualification.json" <<'CHECK'
          import json, os, pathlib, shutil, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value['status'] in ('updated', 'current') and value['latestCheckSucceeded'] and value['selection']
          assert json.loads(pathlib.Path(value['selection']['qualificationPath']).read_text())['platform'] == os.environ['IMAGE_ARCH']
          shutil.copyfile(value['selection']['qualificationPath'], sys.argv[2])
          CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: latest-codex-qualified-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/codex-lock.json
            ${{ runner.temp }}/qualification-result.json
            ${{ runner.temp }}/qualification.json
          retention-days: 30
          if-no-files-found: warn
