name: Prepare reviewed release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag matching package and plugin versions
        required: true
        type: string
      helper_commit:
        description: Full published ultrafast-atif-helper source commit to bundle
        required: true
        type: string
      create_draft:
        description: Attach public artifacts to a draft GitHub release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HELPER_COMMIT: ${{ inputs.helper_commit }}
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      TYPESAFE_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate requested tag syntax
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$HELPER_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lwyBZss8924d/ultrafast-atif-helper
          ref: ${{ inputs.helper_commit }}
          path: _bundle-helper-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run check
      - name: Require matching release identity
        run: python3 -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("package.json"))["version"]'
      - run: python3 scripts/distribution/test_package.py
      - run: python3 scripts/distribution/test_skill_docs.py
      - run: python3 scripts/distribution/skill-docs.py check
      - name: Verify independently installed Skill folder
        run: |
          python3 -c 'import os,pathlib,shutil; shutil.copytree("skills/task-checkpoint-record", pathlib.Path(os.environ["RUNNER_TEMP"])/"skill-only", symlinks=True)'
          python3 scripts/distribution/skill-docs.py links --skill-root "$RUNNER_TEMP/skill-only"
      - run: python3 scripts/distribution/test_bundle.py
      - run: python3 container/test-protocol.py
      - run: python3 scripts/distribution/package.py archive --output "$RUNNER_TEMP/public-artifacts"
      - name: Assemble exact committed unified payload
        run: >-
          python3 scripts/distribution/bundle.py --recorder-repo .
          --recorder-commit "$(git rev-parse HEAD)" --helper-repo _bundle-helper-source
          --helper-commit "$HELPER_COMMIT" --output "$RUNNER_TEMP/bundle-artifacts"
      - name: Unpack, install both CLIs, ingest and query synthetic data
        run: >-
          python3 scripts/distribution/smoke-bundle.py
          --archive "$RUNNER_TEMP"/bundle-artifacts/*-bundle.tar.gz --bun "$(command -v bun)" --node "$(command -v node)"
      - name: Add unified payload to reviewed public artifacts
        run: cp "$RUNNER_TEMP"/bundle-artifacts/* "$RUNNER_TEMP/public-artifacts/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source-and-plugin
          path: ${{ runner.temp }}/public-artifacts/*
          if-no-files-found: error
          retention-days: 30
  draft:
    if: inputs.create_draft
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download this run's allowlisted artifacts
        run: gh run download "$GITHUB_RUN_ID" --name release-source-and-plugin --dir public-artifacts
      - name: Verify artifact checksums
        working-directory: public-artifacts
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check ./*-bundle.SHA256SUMS
      - name: Create draft release only
        run: >-
          gh release create "$RELEASE_TAG" public-artifacts/*
          --verify-tag --draft --title "$RELEASE_TAG"
          --notes 'Public source and Skills plugin artifacts. No credentials, private trajectories, Git notes or runtime evidence are included.'
